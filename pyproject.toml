[tool.pdm.dev-dependencies]
dev = ["setuptools<76.0.0,>=75.5.0"]
[tool.pdm.build]
includes = ["nonebot_plugin_savepic"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
authors = [{ name = "Yan", email = "1964649083@qq.com" }]
license = { text = "MIT" }
requires-python = "<4.0,>=3.11"
dependencies = [
    "nonebot2<3.0.0,>=2.4.0",
    "asyncpg<1.0.0,>=0.28.0",
    "nonebot-adapter-onebot<3.0.0,>=2.4.6",
    "numpy<3.0.0,>=2.1.3",
    "httpx<1.0.0,>=0.28.0",
    "nonebot-plugin-alconna>=0.60.4",
    "nonebot-adapter-milky<2.0.0,>=1.3.0",
]
name = "nonebot-plugin-savepic"
version = "0.6.7"
description = "保存表情包（语录）与随机出图"
readme = "README.md"

[project.urls]
homepage = "https://github.com/Yan-Zero/nonebot-plugin-savepic"

[dependency-groups]
dev = [
    "nonebot2[fastapi,httpx,websockets]>=2.5.0",
    "nonebug>=0.4.4",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "setuptools<76.0.0,>=75.5.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
